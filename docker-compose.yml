services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - SEARCH_SERVICE_V1_URL=http://search-service-v1:8081
      - SEARCH_SERVICE_V2_URL=http://search-service-v2:8082
    depends_on:
      - search-service-v1
      - search-service-v2
    networks:
      - microservice-net
    restart: unless-stopped

  search-service-v1:
    build:
      context: ./search-service-v1
      dockerfile: Dockerfile
    container_name: search-service-v1
    ports:
      - "8081:8081"
    networks:
      - microservice-net
    restart: unless-stopped

  search-service-v2:
    build:
      context: ./search-service-v2
      dockerfile: Dockerfile
    container_name: search-service-v2
    ports:
      - "8082:8082"
    networks:
      - microservice-net
    restart: unless-stopped

networks:
  microservice-net:
    driver: bridge
