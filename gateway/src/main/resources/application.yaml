spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Route 1: 80% traffic -> search-service-v1
            - id: search-v1
              uri: ${SEARCH_SERVICE_V1_URL:http://localhost:8081}
              predicates:
                - Path=/api/search,/api/search/**
                - Weight=SearchGroup, 8
              filters:
                - StripPrefix=0

            # Route 2: 20% traffic -> search-service-v2
            - id: search-v2
              uri: ${SEARCH_SERVICE_V2_URL:http://localhost:8082}
              predicates:
                - Path=/api/search,/api/search/**
                - Weight=SearchGroup, 2
              filters:
                - StripPrefix=0

server:
  port: 8080
